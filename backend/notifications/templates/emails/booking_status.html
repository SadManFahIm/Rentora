{% extends "emails/base_email.html" %}
{% block content %}
  <h2 style="margin: 0 0 12px; font-size: 18px; color: #0f172a;">{{ headline }}</h2>
  <p style="margin: 0 0 8px;">Hi {{ user.first_name|default:user.username }},</p>
  <p style="margin: 0 0 20px;">{{ body }}</p>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
    <tr>
      <td style="padding: 16px 20px; font-size: 14px; color: #334155;">
        <strong>Listing:</strong> {{ room.title }}<br />
        <strong>Area:</strong> {{ room.get_area_display|default:room.area }}<br />
        <strong>Monthly rent:</strong> ৳{{ room.price }}
      </td>
    </tr>
  </table>

  <p style="margin: 20px 0 0;">
    <a href="{{ action_url }}" style="background: #f97316; color: #ffffff; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; display: inline-block;">
      View booking
    </a>
  </p>
{% endblock %}

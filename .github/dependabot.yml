# Dependabot — automated dependency updates (PRs are CI-gated like all others)

version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    # Bundle all npm bumps into one PR per week — fewer PRs to review, and no
    # package-lock.json conflicts between concurrent single-package PRs.
    groups:
      frontend-deps:
        patterns:
          - "*"
    # typescript majors are blocked until openapi-typescript supports them:
    # its peer range (^5.x) makes `npm ci` fail with ERESOLVE when TS 6/7 is
    # installed, breaking the whole grouped PR. TS 5.x minor/patch updates
    # still flow through normally.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6"]
      # jsdom 30.1 breaks Radix Select inside the test environment: the
      # dropdown never opens (pointer AND keyboard activation both fail), so
      # AdminDisputesPanel.test.tsx times out on findByRole("listbox"). Pin
      # 30.0.x until jsdom or Radix fixes the regression.
      - dependency-name: "jsdom"
        versions: [">=30.1"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    # Same rationale as the npm group above.
    groups:
      backend-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /   # workflow files in .github/workflows
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
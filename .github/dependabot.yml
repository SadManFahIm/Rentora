# Dependabot — automated dependency updates (PRs are CI-gated like all others)

version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    # Bundle all npm bumps into one PR per week — fewer PRs to review, and no
    # package-lock.json conflicts between concurrent single-package PRs.
    groups:
      frontend-deps:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    # Same rationale as the npm group above.
    groups:
      backend-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /   # workflow files in .github/workflows
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Verify no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        # fail_under=55 lives in backend/.coveragerc. E2E suites run in the
        # dedicated `e2e` job (tagged @tag("e2e")) — excluded here so they're
        # not double-run and don't skew the unit-test coverage gate.
        run: |
          coverage run manage.py test --exclude-tag=e2e
          coverage report
          coverage xml -o coverage.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: error

  api-contract:
    # Live contract check of docs/api-reference.md against a running server
    # (docs/tools/api-verify.py). Catches drift between the hand-maintained
    # reference and the real API before it reaches main.
    name: API contract (live docs check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate database
        run: python manage.py migrate --noinput

      - name: Live API contract check
        # Boot a dev server on 8002 (fresh DB — the verify script bootstraps
        # its own fixture room), wait for readiness, run the endpoint suite.
        run: |
          python manage.py runserver 127.0.0.1:8002 --noreload > /tmp/api-server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8002/api/v1/schema/ 2>/dev/null; then
              echo "server ready after ~$((i * 2))s"
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "::error::API server never became ready"
            tail -50 /tmp/api-server.log
            exit 1
          fi
          API_BASE=http://127.0.0.1:8002/api/v1 python ../docs/tools/api-verify.py
          EXIT=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit "$EXIT"

  schema-drift:
    # Diff the PR head's OpenAPI schema against the base branch and post a
    # sticky PR comment when the contract moved (endpoints added/removed,
    # request/response schema refs changed, component fields/types changed).
    # Doc-only changes (descriptions/examples) are NOT drift. Fork PRs get a
    # read-only GITHUB_TOKEN so commenting may fail there — never fail CI for it.
    name: Schema drift (API diff comment)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dump base schema (worktree at base SHA)
        # On PRs the base is the target branch; on pushes it is the commit the
        # push was based on (github.event.before), so the gate also runs on main.
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          git worktree add /tmp/base "$BASE_SHA"
          (cd /tmp/base/backend && python manage.py spectacular --file /tmp/base-schema.json --format openapi-json 2>/dev/null)
          git worktree remove /tmp/base --force

      - name: Dump head schema
        run: python manage.py spectacular --file /tmp/head-schema.json --format openapi-json 2>/dev/null

      - name: Run drift diff
        id: drift
        # Exit 1 = drift found; that must NOT fail the job (we want the comment
        # posted, and drift itself is information, not a hard failure). Use
        # `set +e` because the default bash -e would abort before EXIT=$?.
        run: |
          set +e
          python ../docs/tools/schema-drift.py /tmp/base-schema.json /tmp/head-schema.json --out /tmp/drift.md
          EXIT=$?
          set -e
          echo "drift_found=$([ $EXIT -eq 1 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post drift comment
        if: steps.drift.outputs.drift_found == '1'
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          header: api-schema-drift
          path: /tmp/drift.md

  frontend-contract:
    # Regenerate the frontend's TypeScript types from the live OpenAPI schema
    # and typecheck the hand-written wire types (services/mappers.ts) against
    # them via src/lib/schemaContract.ts. A backend field rename/removal or
    # incompatible type change fails this check before the PR can merge.
    name: Frontend contract (schema -> TS types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dump OpenAPI schema
        run: |
          mkdir -p ../frontend/src/generated
          python manage.py spectacular --file ../frontend/src/generated/openapi.json --format openapi-json 2>/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate TypeScript types from schema
        run: npx openapi-typescript src/generated/openapi.json -o src/generated/openapi.d.ts
        working-directory: frontend

      - name: Typecheck wire types against schema
        run: npx tsc --noEmit -p tsconfig.contract.json
        working-directory: frontend

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: Build
        run: npm run build

      - name: Validate PWA (manifest + icons + sw)
        # Proves the built app actually ships a valid installable manifest,
        # real-size icons (PNG header check), a maskable icon and sw.js.
        run: node ../scripts/validate-pwa.mjs

  lighthouse:
    # Performance gate (Phase 13 — Reach): Lighthouse against the built app,
    # so a bundle regression fails CI instead of reaching users. The JSON
    # report is uploaded as an artifact for inspection.
    name: Lighthouse (performance gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run Lighthouse gate
        run: node scripts/lighthouse-gate.mjs http://localhost:4173 --min-score 70

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: frontend/scripts/.lighthouse/
          include-hidden-files: true
          if-no-files-found: warn

  e2e:
    # Cross-app E2E suites (fraud auto-scan x booking, payments/tier
    # promotions, KYC/verified-badge chain). Kept as their own job so an
    # integration regression is visible at a glance and re-runnable
    # independently, rather than buried inside the (coverage-gated) backend
    # unit-test job. Failures post a PR comment listing the failing tests.
    name: E2E (fraud + payments + KYC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E tests
        id: e2e
        # Never hard-fail here: the comment must be posted first, then a final
        # step fails the job (so the PR still shows a red required check).
        continue-on-error: true
        run: |
          set +e
          python manage.py test --tag=e2e 2>&1 | tee e2e-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build E2E failure comment
        if: steps.e2e.outputs.exit_code != '0' && github.event_name == 'pull_request'
        run: |
          FAILURES=$(grep -cE "^(FAIL|ERROR):" e2e-report.txt || echo 0)
          {
            echo "## ❌ E2E tests failed"
            echo ""
            echo "**$FAILURES failing test(s)** — run: \`python manage.py test --tag=e2e\`"
            echo ""
            echo '<details><summary>Click to expand the failing tests</summary>'
            echo ''
            echo '```'
            grep -E "^(FAIL|ERROR):" e2e-report.txt || echo "(no FAIL/ERROR lines captured)"
            echo '```'
            echo '</details>'
          } > e2e-comment.md

      - name: Post E2E failure comment
        # Fork PRs get a read-only GITHUB_TOKEN, so commenting can fail there
        # (office fork -> personal repo PRs). Never fail the check for it.
        if: steps.e2e.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          path: e2e-comment.md

      - name: Fail the job on E2E failure
        if: steps.e2e.outputs.exit_code != '0'
        run: exit 1

  browser-e2e:
    # Browser-level Playwright smoke suite (Tier 4) — boots the real Vite
    # app + Django API and drives Chromium through boot, navigation, the
    # Copilot widget and the EN⇄BN toggle. The second, real-browser layer
    # on top of the tagged Django API E2E suites.
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Migrate + start the backend
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 8000 --noreload > /tmp/rentora-be.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/rooms/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Backend did not come up" && cat /tmp/rentora-be.log && exit 1

      - name: Run browser smoke tests
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results/
          if-no-files-found: ignore

  coverage-summary:
    name: Coverage summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: coverage/frontend

      - name: Code Coverage Summary Report
        # CodeCoverageSummary only reads Cobertura XML; comma-separated list.
        # Coverage thresholds are already enforced per-job (.coveragerc /
        # vitest) — this step only reports, never fails the check.
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/backend/coverage.xml,coverage/frontend/cobertura-coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "50 75"

      - name: Append file-level detail to summary
        run: python3 scripts/coverage_details.py coverage/backend/coverage.xml coverage/frontend/cobertura-coverage.xml code-coverage-results.md

      - name: Add Coverage PR Comment
        # Fork PRs get a read-only GITHUB_TOKEN, so commenting can fail there
        # (e.g. office fork -> personal repo PRs). Never fail the check for it.
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          recreate: true
          path: code-coverage-results.md

  coverage-history:
    name: Coverage history
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Runs on PRs and pushes alike; each branch gets its own history file
    # (history-<branch>.csv) on the coverage-history branch. Fork PRs have a
    # read-only GITHUB_TOKEN, so the deploy push is continue-on-error there
    # (the history is still generated and validated locally).
    concurrency:
      group: coverage-history-${{ github.head_ref || github.ref }}
      # Wait for any in-flight run of the same group instead of cancelling it.
      # cancel-in-progress:true marked the older run cancelled (red required
      # check) whenever two merges to main landed within ~a minute — both runs
      # share this group, so the newer job killed the older one mid-checkout.
      # Serialization alone is enough: the force-push to coverage-history is
      # already ordered, and a waiting run is green, not cancelled.
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: coverage/frontend

      - name: Fetch previous history
        run: |
          mkdir -p coverage-site
          # Distinguish "branch doesn't exist yet" (fresh start is fine) from a
          # genuine fetch failure (must abort — a stale seed would wipe history).
          if git ls-remote --exit-code origin coverage-history >/dev/null 2>&1; then
            git fetch origin coverage-history
            for f in $(git ls-tree --name-only origin/coverage-history | grep -E '\.(csv|html)$' || true); do
              git show origin/coverage-history:$f > coverage-site/$f 2>/dev/null || true
            done
          else
            echo "coverage-history branch does not exist yet — will create it"
          fi

      - name: Update coverage history
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 scripts/coverage_history.py coverage/backend/coverage.xml coverage/frontend/cobertura-coverage.xml coverage-site

      - name: Deploy to coverage-history branch
        # Fork PRs get a read-only GITHUB_TOKEN and cannot push to the
        # coverage-history branch — report the attempt without failing the job.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan coverage-history
          git rm -rf . --quiet 2>/dev/null || true
          cp coverage-site/* ./
          git add -A
          if git diff --cached --quiet; then
            echo "No coverage changes — skipping commit"
            exit 0
          fi
          git commit -m "coverage: update ${{ github.head_ref || github.ref_name }} history for ${{ github.sha }}" --quiet
          git push origin coverage-history --force

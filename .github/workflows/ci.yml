name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Verify no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        # fail_under=55 lives in backend/.coveragerc
        run: |
          coverage run manage.py test
          coverage report
          coverage xml -o coverage.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: Build
        run: npm run build

  coverage-summary:
    name: Coverage summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend

      - name: Code Coverage Summary Report
        # CodeCoverageSummary only reads Cobertura XML; comma-separated list.
        # Coverage thresholds are already enforced per-job (.coveragerc /
        # vitest) — this step only reports, never fails the check.
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/backend/coverage.xml,coverage/frontend/cobertura-coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "50 75"

      - name: Append file-level detail to summary
        run: python3 scripts/coverage_details.py coverage/backend/coverage.xml coverage/frontend/cobertura-coverage.xml code-coverage-results.md

      - name: Add Coverage PR Comment
        # Fork PRs get a read-only GITHUB_TOKEN, so commenting can fail there
        # (e.g. office fork -> personal repo PRs). Never fail the check for it.
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          recreate: true
          path: code-coverage-results.md

  coverage-history:
    name: Coverage history (branch)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend

      - name: Fetch existing history from coverage-history branch
        run: |
          git fetch origin coverage-history || true
          if git ls-tree -r --name-only origin/coverage-history -- docs/coverage/history.csv 2>/dev/null | grep -q history.csv; then
            mkdir -p docs/coverage
            git show origin/coverage-history:docs/coverage/history.csv > docs/coverage/history.csv
          fi

      - name: Update coverage history
        run: |
          python3 scripts/coverage_history.py coverage/backend/coverage.xml coverage/frontend/cobertura-coverage.xml docs/coverage

      - name: Deploy to coverage-history branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: coverage-history
          publish_dir: docs/coverage
          keep_files: true
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "coverage: update history for ${{ github.sha }}"

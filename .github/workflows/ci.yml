name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Verify no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        # fail_under=55 lives in backend/.coveragerc. E2E suites run in the
        # dedicated `e2e` job (tagged @tag("e2e")) — excluded here so they're
        # not double-run and don't skew the unit-test coverage gate.
        run: |
          coverage run manage.py test --exclude-tag=e2e
          coverage report
          coverage xml -o coverage.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: Build
        run: npm run build

  e2e:
    # Cross-app E2E suites (fraud auto-scan x booking, payments/tier
    # promotions). Kept as their own job so an integration regression is
    # visible at a glance and re-runnable independently, rather than buried
    # inside the (coverage-gated) backend unit-test job.
    name: E2E (fraud + payments)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E tests
        run: python manage.py test --tag=e2e

  coverage-summary:
    name: Coverage summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend

      - name: Code Coverage Summary Report
        # CodeCoverageSummary only reads Cobertura XML; comma-separated list.
        # Coverage thresholds are already enforced per-job (.coveragerc /
        # vitest) — this step only reports, never fails the check.
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/backend/coverage.xml,coverage/frontend/cobertura-coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "50 75"

      - name: Append file-level detail to summary
        run: python3 scripts/coverage_details.py coverage/backend/coverage.xml coverage/frontend/cobertura-coverage.xml code-coverage-results.md

      - name: Add Coverage PR Comment
        # Fork PRs get a read-only GITHUB_TOKEN, so commenting can fail there
        # (e.g. office fork -> personal repo PRs). Never fail the check for it.
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          recreate: true
          path: code-coverage-results.md

  coverage-history:
    name: Coverage history
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Runs on both main pushes AND pull requests; each branch gets its own
    # history file (history-<branch>.csv) on the coverage-history branch.
    # Fork PRs get a read-only GITHUB_TOKEN (no contents:write), so they skip
    # the job instead of failing — mirroring the coverage-summary behaviour.
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: coverage-history-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend

      - name: Fetch previous history
        run: |
          mkdir -p coverage-site
          # Distinguish "branch doesn't exist yet" (fresh start is fine) from a
          # genuine fetch failure (must abort — a stale seed would wipe history).
          if git ls-remote --exit-code origin coverage-history >/dev/null 2>&1; then
            git fetch origin coverage-history
            for f in $(git ls-tree --name-only origin/coverage-history | grep -E '\.(csv|html)$' || true); do
              git show origin/coverage-history:$f > coverage-site/$f 2>/dev/null || true
            done
          else
            echo "coverage-history branch does not exist yet — will create it"
          fi

      - name: Update coverage history
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 scripts/coverage_history.py coverage/backend/coverage.xml coverage/frontend/cobertura-coverage.xml coverage-site

      - name: Deploy to coverage-history branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan coverage-history
          git rm -rf . --quiet 2>/dev/null || true
          cp coverage-site/* ./
          git add -A
          if git diff --cached --quiet; then
            echo "No coverage changes — skipping commit"
            exit 0
          fi
          git commit -m "coverage: update ${{ github.head_ref || github.ref_name }} history for ${{ github.sha }}" --quiet
          git push origin coverage-history --force
